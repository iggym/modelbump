[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "modelbump"
version = "0.1.0"
description = "Behavioral diff for model upgrades and deprecations"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Iggy", email = "iggym@users.noreply.github.com" }]
keywords = ["llm", "evaluation", "model-migration", "deprecation", "drift", "ci"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Testing",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "httpx>=0.27",
  "jsonschema>=4.21",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
# The surfacelock registry is preferred when installed; modelbump ships a bundled
# offline snapshot so the tool works without it.
registry = ["surfacelock>=0.1"]
bedrock = ["botocore>=1.34"]
tokens = ["tiktoken>=0.7"]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "respx>=0.21",
  "ruff>=0.5",
  "mypy>=1.10",
]

[project.scripts]
modelbump = "modelbump.cli:main"

[project.urls]
Homepage = "https://github.com/iggym/modelbump"
Documentation = "https://github.com/iggym/modelbump#readme"
Repository = "https://github.com/iggym/modelbump"
Changelog = "https://github.com/iggym/modelbump/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/modelbump"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "docs", "README.md", "LICENSE", "action.yml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
packages = ["modelbump"]
ignore_missing_imports = true
